<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Motshy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- ================== Open Graph ================== -->
  <meta property="og:title" content="Motshy MarketPlace" />
  <meta property="og:description" content="شوف البوست ده على تطبيق Motshy" />
  <meta property="og:image" content="https://myvmwawjbuitapdwpaly.supabase.co/storage/v1/object/public/images/pergandy%20Words.webp" />
  <meta property="og:url" content="https://motshy-egypt.github.io/marketPlace/index.html" />
  <meta property="og:type" content="article" />

  <!-- ================== Twitter / WhatsApp ================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Motshy MarketPlace" />
  <meta name="twitter:description" content="شوف البوست ده على تطبيق Motshy" />
  <meta name="twitter:image" content="https://myvmwawjbuitapdwpaly.supabase.co/storage/v1/object/public/images/pergandy%20Words.webp" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 300px;
    }
    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top: 4px solid #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background-color: #444;
    }
  </style>

 <script>
  const marketPlaceId = new URLSearchParams(window.location.search).get("id");
  const deepLink = marketPlaceId ? `motshy://app/marketPlaces/${marketPlaceId}` : "motshy://app";

  const ua = navigator.userAgent;

  const isIOS =
    /iphone|ipad|ipod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  const isAndroid =
    /android/i.test(ua) ||
    (!isIOS && /Linux/i.test(ua) && navigator.maxTouchPoints > 0);

  const fallbackUrl = isAndroid
    ? "https://play.google.com/store/apps/details?id=com.motshy.app"
    : isIOS
      ? "https://apps.apple.com/app/id1234567890" // غيّر الـ ID
      : "https://motshy-egypt.github.io"; // صفحة بديلة للكمبيوتر

  let timer;

  function openApp() {
    window.location = deepLink;
    timer = setTimeout(() => {
      window.location = fallbackUrl;
    }, 1500);
  }

  // لو التطبيق اتفتح والصفحة اتخفت، الغي التحويل للمتجر
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) clearTimeout(timer);
  });

  window.addEventListener("load", () => {
    if (isAndroid || isIOS) {
      setTimeout(openApp, 500);
    } else {
      window.location = fallbackUrl;
    }
  });
</script>
</head>

<body>
  <div class="container">
    <img
      src="https://myvmwawjbuitapdwpaly.supabase.co/storage/v1/object/public/images/pergandy%20Words.webp"
      alt="Logo"
      style="width: 290px;"
    >

    <h4>Motshy app is currently opening.</h4>

    <div class="spinner"></div>

    <p>
      Redirecting... If it doesn't happen automatically, you can click the button below.
    </p>

    <button class="btn" onclick="openApp()">Open in App</button>
  </div>
</body>
</html>
